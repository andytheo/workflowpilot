name: Prepare short-form content packs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 2'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate content packs
        run: python scripts/build_content_pack.py
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Render original visual assets
        run: python scripts/render_visuals.py
      - name: Upload review-ready pack
        uses: actions/upload-artifact@v4
        with:
          name: workflowpilot-production-pack
          path: production/
          retention-days: 14
