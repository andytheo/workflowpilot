name: Prepare short-form content packs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 2'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate content packs
        run: python scripts/build_content_pack.py
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Render original visual assets
        run: python scripts/render_visuals.py
      - name: Upload review-ready pack
        uses: actions/upload-artifact@v4
        with:
          name: workflowpilot-production-pack
          path: production/
          retention-days: 14
      - name: Save generated scripts and images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update generated content packs and visuals"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
